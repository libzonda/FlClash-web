name: Build & Publish FlClash-web

on:
  schedule:
    # 每天 UTC 0:00, 6:00, 12:00, 18:00 (每 6 小时监控一次上游最新 release)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Target upstream FlClash tag (leave "latest" for newest stable release, e.g. v0.9.3)'
        required: false
        default: 'latest'
        type: string
      force_build:
        description: 'Force build even if release already exists in current repo'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  UPSTREAM_REPO: 'chen08209/FlClash'
  IMAGE_NAME: flclash-web
  FLUTTER_VERSION: '3.47.8'
  GO_VERSION: '1.27.3'
  SQLITE3_WASM_VERSION: '3.7.0'

jobs:
  check-upstream:
    name: Check Upstream Latest Release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      target_tag: ${{ steps.check.outputs.target_tag }}
      release_title: ${{ steps.check.outputs.release_title }}
    steps:
      - name: Check latest upstream release & compare with local releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          INPUT_TAG: ${{ inputs.upstream_tag || 'latest' }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e

          echo "Triggered by event: ${EVENT_NAME}"
          echo "Target Upstream Repo: ${UPSTREAM_REPO}"

          # Case 1: Triggered by manual tag push in current repo (e.g. git push origin v0.9.3)
          if [ "${EVENT_NAME}" = "push" ] && [[ "${REF_NAME}" =~ ^v[0-9] ]]; then
            echo "Direct tag push detected: ${REF_NAME}"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "target_tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_title=FlClash-web ${REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Case 2: Resolve latest release tag from upstream repository
          if [ "${INPUT_TAG}" = "latest" ] || [ -z "${INPUT_TAG}" ]; then
            echo "Querying latest release from upstream ${UPSTREAM_REPO}..."
            RELEASE_JSON=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" 2>/dev/null || true)
            UPSTREAM_TAG=$(echo "${RELEASE_JSON}" | jq -r '.tag_name // empty')
            UPSTREAM_NAME=$(echo "${RELEASE_JSON}" | jq -r '.name // empty')
            
            if [ -z "${UPSTREAM_TAG}" ] || [ "${UPSTREAM_TAG}" = "null" ]; then
              echo "::warning::Failed to fetch latest release from ${UPSTREAM_REPO}, falling back to tags API..."
              UPSTREAM_TAG=$(gh api "repos/${UPSTREAM_REPO}/tags" --jq '.[0].name // empty' 2>/dev/null || true)
            fi
            
            if [ -z "${UPSTREAM_TAG}" ] || [ "${UPSTREAM_TAG}" = "null" ]; then
              echo "::error::Could not resolve latest upstream tag from ${UPSTREAM_REPO}."
              exit 1
            fi
          else
            UPSTREAM_TAG="${INPUT_TAG}"
            UPSTREAM_NAME="${INPUT_TAG}"
          fi

          # Ensure 'v' prefix
          if [[ "${UPSTREAM_TAG}" =~ ^[0-9] ]]; then
            UPSTREAM_TAG="v${UPSTREAM_TAG}"
          fi
          echo "Target upstream tag resolved: ${UPSTREAM_TAG}"
          echo "target_tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${UPSTREAM_NAME:-$UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"

          # Case 3: Check if release already exists in current repository
          echo "Checking if release ${UPSTREAM_TAG} already exists in ${{ github.repository }}..."
          EXISTING_TAG=$(gh api "repos/${{ github.repository }}/releases/tags/${UPSTREAM_TAG}" --jq '.tag_name // empty' 2>/dev/null || true)

          if [ "${FORCE_BUILD}" = "true" ]; then
            echo "::notice title=Force Build::Force build enabled. Proceeding with build for ${UPSTREAM_TAG}."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${EXISTING_TAG}" = "${UPSTREAM_TAG}" ]; then
            echo "::notice title=Up To Date::Upstream release ${UPSTREAM_TAG} is already built and released in this repository. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=New Release Detected::Found new upstream release: ${UPSTREAM_TAG}! Triggering build..."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-binaries-and-web:
    name: Build Flutter Web & Standalone Binaries
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Use HTTPS for GitHub submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: FlClash/core/go.sum

      - name: Build Web & Standalone Binaries via build.sh
        id: build
        env:
          FLCLASH_TAG: ${{ needs.check-upstream.outputs.target_tag }}
          BUILD_ARCHS: "amd64 arm64"
        run: |
          ./build.sh
          RAW_VER="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' FlClash/pubspec.yaml | head -n 1)"
          VERSION="${RAW_VER:-0.9.3}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice title=FlClash Upstream Version::Built FlClash-web v${VERSION}"

      - name: Upload standalone binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flclash-web-${{ steps.build.outputs.version }}-linux
          path: dist/FlClash-web*
          retention-days: 14

      - name: Upload compiled Flutter Web dist
        uses: actions/upload-artifact@v4
        with:
          name: flclash-web-${{ steps.build.outputs.version }}-static-dist
          path: FlClash/build/web
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.build.outputs.version }}"
          name: "FlClash-web v${{ steps.build.outputs.version }}"
          files: |
            dist/FlClash-web-${{ steps.build.outputs.version }}-linux-amd64.tar.gz
            dist/FlClash-web-${{ steps.build.outputs.version }}-linux-arm64.tar.gz
            dist/FlClash-web-${{ steps.build.outputs.version }}-linux-amd64
            dist/FlClash-web-${{ steps.build.outputs.version }}-linux-arm64
            dist/FlClash-web-${{ steps.build.outputs.version }}-checksums.txt
          generate_release_notes: true

  docker-publish:
    name: Build & Push Docker Image (GHCR & Docker Hub)
    needs: [check-upstream, build-binaries-and-web]
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download prebuilt standalone binaries
        uses: actions/download-artifact@v4
        with:
          name: flclash-web-${{ needs.build-binaries-and-web.outputs.version }}-linux
          path: dist

      - name: Generate fast multi-arch runtime Dockerfile from prebuilt binaries
        run: |
          cat << 'EOF' > Dockerfile.ci
          FROM alpine:3.20
          ARG TARGETARCH
          LABEL org.opencontainers.image.title="FlClash-web" \
                org.opencontainers.image.description="FlClash compiled to native Flutter Web with embedded Clash.Meta core"
          RUN apk add --no-cache ca-certificates iproute2 iptables nftables tzdata && \
              mkdir -p /data /usr/share/flclash
          COPY dist/FlClash-web-linux-${TARGETARCH} /usr/local/bin/FlClash-web
          RUN chmod +x /usr/local/bin/FlClash-web && \
              ln -sf /usr/local/bin/FlClash-web /usr/local/bin/FlClash
          ENV FLCLASH_WEB_LISTEN="0.0.0.0:80" \
              FLCLASH_DATA_DIR="/data"
          VOLUME ["/data"]
          EXPOSE 80 9090 7890
          ENTRYPOINT ["/usr/local/bin/FlClash-web"]
          CMD ["--listen", "0.0.0.0:80", "--data-dir", "/data"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DH_USER}" ] && [ -n "${DH_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && format('docker.io/{0}/{1}', secrets.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
            type=raw,value=${{ needs.build-binaries-and-web.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push single-container Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sync README to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./README_DOCKER.md
          short-description: "A Flutter Web build of FlClash."
          enable-url-completion: true
